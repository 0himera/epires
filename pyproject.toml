[project]
name = "epires"
version = "0.3.2"
description = "Epistemic Auto-Research Harness: VSA Hypergraph, Hypothesis Falsification DAG, Automated Tracing & MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "himera" }
]
keywords = [
    "autoresearch",
    "vsa",
    "hypergraph",
    "mcp",
    "fastapi",
    "ai-agents",
    "scientific-discovery",
    "epistemic-governance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
    "mcp>=1.3.0",
    "parallel-web==1.3.0",
    "httpx>=0.28.0",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/himera/epires"
Repository = "https://github.com/himera/epires"
Documentation = "https://github.com/himera/epires#readme"
Issues = "https://github.com/himera/epires/issues"

[project.scripts]
epires = "epires_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epires_core", "server", "tools", "skills"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293", "E402", "F841"]
